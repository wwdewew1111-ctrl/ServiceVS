<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACEIT Card Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
<style>
[hidden] { display: none !important; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0c; font-family: 'Inter', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 16px; }
#card { position: relative; width: 850px; padding: 18px 22px 0; overflow: hidden; background: radial-gradient(ellipse 85% 380px at 50% -40px, rgba(255,26,43,0.30), transparent 70%), radial-gradient(ellipse 70% 260px at 50% 100%, rgba(255,26,43,0.14), transparent 70%), #0a0a0c; }
#card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(135deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 14px); }
#card > * { position: relative; z-index: 1; }
.wm-row { display: flex; justify-content: space-between; font-size: 9px; font-weight: 600; letter-spacing: 2px; color: rgba(255,255,255,0.28); }
.title { margin: 16px 0; text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 48px; line-height: 1.1; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 28px rgba(255,26,43,0.45); }
.title.long { font-size: 36px; } .title.xlong { font-size: 28px; }
.lg { position: relative; flex: none; display: flex; align-items: center; justify-content: center; }
.lg img { width: 100%; height: 100%; object-fit: contain; }
.lg .ph { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-weight: 700; color: #ff1a2b; background: linear-gradient(135deg, #1a0508, #000); border: 1.5px solid #ff1a2b; border-radius: 22%; box-shadow: inset 0 0 14px rgba(255,26,43,0.35), 0 0 12px rgba(255,26,43,0.25); }
.lg .ph.show, .lg.fail .ph { display: flex; }
.board { background: #121216; border: 1px solid #2e1216; border-radius: 10px; overflow: hidden; }
.board-top { display: grid; grid-template-columns: 200px 1fr 200px; justify-items: center; align-items: center; padding: 16px 34px; }
.board-top > div { min-width: 0; }
.board-top .lg { width: 150px; height: 150px; }
.score { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 88px; line-height: 1; display: flex; align-items: center; gap: 20px; }
.score .dash { font-size: 40px; color: #5a2a2f; font-weight: 500; }
.score .win { color: #ff1a2b; text-shadow: 0 0 26px rgba(255,26,43,0.65); }
.board-bot { display: grid; grid-template-columns: 200px 1fr 200px; justify-items: center; align-items: center; padding: 9px 34px; background: #0d0d10; border-top: 1px solid #2e1216; }
.board-bot .name { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
.board-bot .bo { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 3px; color: #ff1a2b; font-weight: 600; }
.maps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.map { background: #121216; border: 1px solid #2e1216; border-radius: 10px; overflow: hidden; }
.map:last-child:nth-child(odd) { grid-column: 1 / -1; }
.map-body { position: relative; display: flex; height: 112px; }
.map-score { width: 46%; display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: 1px; }
.map-score .c { color: #ff1a2b; margin: 0 4px; } .map-score .dim { color: rgba(255,255,255,0.55); }
.map-img { position: relative; flex: 1; background: linear-gradient(135deg, #2a0a0e, #0a0a0c); overflow: hidden; }
.map-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.map-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #121216 0%, rgba(18,18,22,0) 38%), linear-gradient(0deg, rgba(10,10,12,0.45), transparent 50%); }
.map-win { position: absolute; right: 9px; bottom: 8px; z-index: 3; width: 30px; height: 30px; padding: 3px; border-radius: 50%; background: rgba(10,10,12,0.85); border: 1px solid #ff1a2b; box-shadow: 0 0 10px rgba(255,26,43,0.5); }
.map-win .ph { font-size: 12px; }
.map-foot { display: flex; align-items: center; padding: 8px 16px; background: #0d0d10; border-top: 1px solid #2e1216; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
.map-bar { height: 3px; background: linear-gradient(90deg, #ff1a2b, rgba(255,26,43,0.15)); }
.tables { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.tbl { background: #121216; border: 1px solid #2e1216; border-radius: 10px; padding: 12px 14px 8px; }
.tbl.win { border-color: #ff1a2b; box-shadow: 0 0 0 1px rgba(255,26,43,0.3), 0 0 24px rgba(255,26,43,0.18); }
.tbl-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.tbl-head .lg { width: 28px; height: 28px; }
.tbl-head .ph { font-size: 13px; }
.tbl-head .nm { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: 1px; line-height: 1.2; min-width: 0; }
.row { display: grid; grid-template-columns: 1.5fr 1fr 0.95fr 0.8fr 0.8fr; align-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.row > div { text-align: center; } .row > div:first-child { text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-right: 6px; }
.row.h { font-size: 9px; letter-spacing: 1.5px; color: #8a6a6e; padding-bottom: 6px; border-bottom: 1px solid #2e1216; }
.row.p { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); } .row.p:last-child { border-bottom: none; }
.rtg { font-weight: 800; } .rtg.good { color: #2ecc71; } .rtg.bad { color: #ff3344; }
.footer { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 12px; padding: 18px 0 20px; }
.footer .left, .footer .right { font-size: 9px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.45); }
.footer .right { text-align: right; }
.footer .center { display: flex; align-items: center; gap: 12px; }
.footer .center img { height: 38px; width: auto; display: block; filter: drop-shadow(0 0 8px rgba(255,26,43,0.6)); }
.footer .center .div { width: 1px; height: 26px; background: #3a1a1e; }
.footer .center .brand { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: 2px; }
.footer .center .brand b { color: #ff1a2b; }
.footer::after { content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 170px; height: 5px; background: #ff1a2b; border-radius: 4px 4px 0 0; box-shadow: 0 0 16px rgba(255,26,43,0.8); }

#card.player-mode { width: 850px; height: 850px; padding: 0; }
#card.player-mode::before { display: none; }
#card.theme-light { background: radial-gradient(circle at 80% 15%, #ffffff 0%, transparent 45%), radial-gradient(circle at 10% 90%, #e2e5ea 0%, transparent 50%), #f3f4f6; color: #141923; }
#card.theme-dark { background: radial-gradient(circle at 30% 20%, #161d33, #060811 70%); color: #fff; }
.pc { position: relative; width: 100%; height: 100%; }
.corner { position: absolute; width: 16px; height: 16px; border: 0 solid currentColor; }
.c-tl { top: 24px; left: 24px; border-top-width: 2px; border-left-width: 2px; }
.c-tr { top: 24px; right: 24px; border-top-width: 2px; border-right-width: 2px; }
.c-bl { bottom: 24px; left: 24px; border-bottom-width: 2px; border-left-width: 2px; }
.c-br { bottom: 24px; right: 24px; border-bottom-width: 2px; border-right-width: 2px; }
.p-vs { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 300px; line-height: 1; color: rgba(0,0,0,0.03); pointer-events: none; }
.theme-dark .p-vs { color: rgba(255,255,255,0.03); }
.p-title { position: absolute; top: 44px; left: 0; right: 0; text-align: center; font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 38px; line-height: 1.2; text-transform: uppercase; color: inherit; }
.theme-dark .p-nick { color: #f4ff00; }
.p-plash { position: absolute; left: 40px; top: 200px; width: 34px; height: 480px; background: #f4ff00; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.p-plash span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; color: #0a0c14; white-space: nowrap; }
.p-stat { position: absolute; left: 96px; width: 230px; height: 170px; border-radius: 16px; background: linear-gradient(180deg, #07090f 0%, #1c2336 100%); display: flex; align-items: center; justify-content: center; padding-bottom: 18px; }
.p-stat.s1 { top: 200px; } .p-stat.s2 { top: 386px; } .p-stat.s3 { top: 572px; }
.p-val { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 86px; line-height: 1; color: #f4ff00; white-space: nowrap; }
.p-val .dot { color: #fff; }
.p-cap { position: absolute; left: 50%; bottom: -19px; transform: translateX(-50%); width: 180px; height: 38px; border-radius: 12px; background: #fff; color: #0a0c14; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; }
.p-photo { position: absolute; left: 462px; top: 140px; width: 340px; height: 540px; }
.p-photo img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; -webkit-mask-image: linear-gradient(to bottom, #000 75%, transparent 100%); mask-image: linear-gradient(to bottom, #000 75%, transparent 100%); }
.p-footer { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; align-items: center; justify-content: center; gap: 12px; }
.p-footer img { height: 38px; width: auto; display: block; }
.p-div { width: 1px; height: 26px; background: currentColor; opacity: 0.3; }
.p-brand { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 1px; }
.p-bar { position: absolute; left: 305px; bottom: 0; width: 240px; height: 14px; background: #f4ff00; }

.tabs { display: flex; gap: 8px; width: 850px; max-width: 100%; }
.tab { flex: 1; height: 44px; border-radius: 8px; border: 1px solid #2e1216; background: #121216; color: #fff; font: 600 14px 'Inter', sans-serif; cursor: pointer; transition: background .2s, border-color .2s; }
.tab:hover { border-color: #ff1a2b; }
.tab.active { background: #ff1a2b; border-color: #ff1a2b; }
.bar { width: 850px; max-width: 100%; display: flex; flex-direction: column; gap: 12px; }
.panel { display: flex; flex-direction: column; gap: 8px; }
.line { display: flex; gap: 8px; flex-wrap: wrap; }
.team-edit { display: flex; gap: 8px; flex: 1 1 320px; min-width: 0; }
.field { flex: 1; min-width: 0; height: 44px; padding: 0 14px; background: #121216; border: 1px solid #2e1216; border-radius: 8px; color: #fff; font: 500 14px 'Inter', sans-serif; outline: none; transition: border-color .2s; }
.field::placeholder { color: #8a6a6e; }
.field:focus { border-color: #ff1a2b; }
.field.sel { flex: 0 0 200px; }
.field.area { height: auto; min-height: 140px; padding: 12px 14px; resize: vertical; }
.btn { height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #2e1216; background: #121216; color: #fff; font: 600 14px 'Inter', sans-serif; cursor: pointer; white-space: nowrap; transition: background .2s, border-color .2s, opacity .2s; }
.btn:hover:not(:disabled) { border-color: #ff1a2b; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: #ff1a2b; border-color: #ff1a2b; }
.btn.primary:hover:not(:disabled) { background: #e6101f; }
.bar-actions { display: flex; gap: 8px; }
.status { min-height: 20px; font: 500 14px 'Inter', sans-serif; color: #d4d7dc; }
.status.error { color: #ff6b75; }

#seasonResults { display: flex; flex-direction: column; gap: 24px; align-items: center; }
.season-item { display: flex; flex-direction: column; gap: 8px; width: 850px; max-width: 100%; }
.season-card { width: 100%; background: #0d0f14; color: #fff; padding: 24px; border: 1px solid #2e1216; border-radius: 10px; }
.sc-head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.sc-logo { width: 56px; height: 56px; }
.sc-logo .ph { font-size: 20px; }
.sc-team { font: 600 11px 'Inter', sans-serif; letter-spacing: 2px; color: #8a6a6e; text-transform: uppercase; }
.sc-head h2 { font: 700 26px/1.2 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
.season-card table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.season-card th { font-size: 9px; letter-spacing: 1px; color: #8a6a6e; font-weight: 600; text-align: center; padding: 6px 4px; border-bottom: 1px solid #2e1216; }
.season-card td { text-align: center; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 600; }
.season-card th:first-child, .season-card td:first-child { text-align: left; white-space: nowrap; }
</style>
<style>
/* Match preview: deliberately separate from the finished-match card. */
#card.preview-mode { width: 850px; height: 850px; padding: 0; background: #f1f1ef; color: #111522; }
#card.preview-mode::before { display: none; }
.preview-art { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 47%, #fff 0%, #f1f1ef 56%, #d9dbdd 100%); }
.preview-art::before { content: 'MATCH DAY'; position: absolute; top: 145px; left: -95px; width: 1100px; color: rgba(23,28,43,.045); font: italic 900 210px/.85 'Oswald', sans-serif; letter-spacing: -8px; transform: rotate(-12deg); white-space: nowrap; }
.preview-art::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(135deg, transparent 0 30px, rgba(24,28,39,.018) 31px 32px); }
.preview-frame { position: absolute; inset: 22px; border: 1px solid rgba(20,25,39,.16); pointer-events: none; }
.preview-top { position: absolute; top: 38px; left: 55px; right: 55px; display: flex; justify-content: space-between; align-items: center; font: 700 11px 'Inter', sans-serif; letter-spacing: 3px; color: #5d626d; }
.preview-label { color: #d5152a; }
.preview-heading { position: absolute; top: 95px; left: 70px; right: 70px; text-align: center; }
.preview-heading small { display: block; color: #d5152a; font: 800 12px 'Inter', sans-serif; letter-spacing: 4px; }
.preview-heading h1 { margin-top: 8px; font: 700 35px/1.08 'Oswald', sans-serif; text-transform: uppercase; overflow-wrap: anywhere; }
.preview-heading p { margin-top: 7px; color: #6f7480; font: 700 11px 'Inter', sans-serif; letter-spacing: 3px; text-transform: uppercase; }
.preview-versus { position: absolute; top: 250px; left: 42px; right: 42px; display: grid; grid-template-columns: 1fr 112px 1fr; align-items: center; text-align: center; }
.preview-team { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 24px; }
.preview-team .lg { width: 190px; height: 190px; filter: drop-shadow(0 14px 18px rgba(20,25,39,.14)); }
.preview-team .lg .ph { font-size: 82px; }
.preview-team-name { width: 100%; min-height: 85px; display: flex; align-items: flex-start; justify-content: center; font: italic 700 38px/1.05 'Oswald', sans-serif; text-transform: uppercase; overflow-wrap: anywhere; }
.preview-team-name.long { font-size: 29px; }
.preview-vs { align-self: start; padding-top: 66px; color: #d5152a; font: italic 700 54px/1 'Oswald', sans-serif; }
.preview-info { position: absolute; top: 620px; left: 90px; right: 90px; min-height: 80px; display: grid; grid-template-columns: 1fr 1.35fr 1fr; align-items: stretch; text-align: center; background: #fff; box-shadow: 0 12px 45px rgba(19,24,37,.12); }
.preview-info > div { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 6px; font: 700 28px/1.1 'Oswald', sans-serif; }
.preview-info small { display: block; margin-bottom: 5px; color: #7b8089; font: 700 9px 'Inter', sans-serif; letter-spacing: 2px; }
.preview-info .preview-time { background: #f2fa27; }
.preview-info .preview-time small { color: #565b1b; }
.preview-footer { position: absolute; left: 55px; right: 55px; bottom: 48px; display: flex; justify-content: space-between; align-items: center; color: #777c86; font: 700 10px 'Inter', sans-serif; letter-spacing: 2px; }
.preview-brand { display: flex; align-items: center; gap: 9px; color: #111522; font: 800 12px 'Unbounded', sans-serif; letter-spacing: 0; }
.preview-brand img { width: 32px; height: 32px; object-fit: contain; }
.preview-accent { position: absolute; bottom: 0; left: 295px; width: 260px; height: 10px; background: #f2fa27; }
.preview-fields { display: flex; gap: 8px; flex-wrap: wrap; }
.preview-fields .field { flex: 1 1 170px; }
.preview-hint { color: #9b8a8d; font: 500 12px/1.4 'Inter', sans-serif; }
#card.preview-mode.preview-dark { background: #0b0d14; color: #f6f6f4; }
.preview-dark .preview-art { background: radial-gradient(ellipse at 50% 43%, #30313c 0%, #151720 50%, #090a0f 100%); }
.preview-dark .preview-art::before { color: rgba(255,255,255,.055); }
.preview-dark .preview-art::after { background: repeating-linear-gradient(135deg, transparent 0 30px, rgba(255,255,255,.025) 31px 32px); }
.preview-dark .preview-frame { border-color: rgba(255,255,255,.2); }
.preview-dark .preview-top, .preview-dark .preview-heading p, .preview-dark .preview-footer { color: #b2b5bf; }
.preview-dark .preview-label, .preview-dark .preview-heading small, .preview-dark .preview-vs { color: #ff4454; }
.preview-dark .preview-team .lg { filter: drop-shadow(0 14px 22px rgba(0,0,0,.45)); }
.preview-dark .preview-info { background: #242732; box-shadow: 0 12px 45px rgba(0,0,0,.35); }
.preview-dark .preview-info small { color: #b4b7c0; }
.preview-dark .preview-info .preview-time { color: #111522; }
.preview-dark .preview-info .preview-time small { color: #565b1b; }
.preview-dark .preview-brand { color: #f6f6f4; }
@media (max-width: 600px) { .tabs { flex-wrap: wrap; } .tab { flex: 1 1 45%; } .bar-actions { flex-wrap: wrap; } }
</style>

<body>
<div class="tabs">
  <button class="tab active" data-mode="match">Карточка матча</button>
  <button class="tab" data-mode="preview">Превью</button>
  <button class="tab" data-mode="player">Карточка игрока</button>
  <button class="tab" data-mode="season">Итоги сезона</button>
</div>

<div id="bar" class="bar">
  <div id="matchPanel" class="panel">
    <div class="line">
      <input id="input" class="field" type="text" autocomplete="off" placeholder="https://www.faceit.com/en/cs2/room/1-xxxxxxxx-... Мой Турнир">
      <button id="create" class="btn primary">Создать</button>
    </div>
    <div id="teamLogos" class="line"></div>
  </div>

  <div id="previewPanel" class="panel" hidden>
    <div class="line">
      <input id="previewLink" class="field" type="text" autocomplete="off" placeholder="Ссылка на предстоящий матч FACEIT">
      <button id="previewCreate" class="btn primary">Создать превью</button>
    </div>
    <div id="previewOptions" class="panel" hidden>
      <div class="preview-fields">
        <input id="previewTitle" class="field" type="text" maxlength="90" placeholder="Название турнира" aria-label="Название турнира">
        <input id="previewSubtitle" class="field" type="text" maxlength="60" placeholder="Этап турнира (необязательно)" aria-label="Этап турнира">
      </div>
      <div class="preview-fields">
        <input id="previewDate" class="field" type="date" aria-label="Дата матча по Москве">
        <input id="previewTime" class="field" type="time" aria-label="Время матча по Москве">
        <input id="previewFormat" class="field" type="text" maxlength="12" placeholder="Формат, например BO3" aria-label="Формат матча">
        <select id="previewTheme" class="field sel" aria-label="Тема превью">
          <option value="light">Светлая тема</option>
          <option value="dark">Тёмная тема</option>
        </select>
      </div>
      <div class="preview-hint">Дата и время указаны по Москве (МСК). Названия и логотипы команд сохраняются в этом браузере.</div>
      <div id="previewTeamLogos" class="line"></div>
    </div>
  </div>

  <div id="playerPanel" class="panel" hidden>
    <div class="line">
      <input id="pMatch" class="field" type="text" autocomplete="off" placeholder="Ссылка на матч FACEIT (faceit.com/.../room/1-...)">
      <select id="pMap" class="field sel" hidden><option value="all">Вся серия</option></select>
    </div>
    <input id="pPlayer" class="field" type="text" autocomplete="off" placeholder="Ссылка на профиль игрока (faceit.com/.../players/НИК)">
    <div class="line">
      <input id="pNick" class="field" type="text" autocomplete="off" placeholder="Отображаемый ник (необязательно)">
      <select id="pTheme" class="field sel">
        <option value="light">Белая тема</option>
        <option value="dark">Тёмная тема</option>
      </select>
    </div>
    <div class="line">
      <button id="pPhotoBtn" class="btn">Загрузить фото игрока</button>
      <input id="pPhotoFile" type="file" accept="image/*" hidden>
      <input id="pPhotoUrl" class="field" type="text" autocomplete="off" placeholder="Ссылка на фото или вставьте картинку через Ctrl+V">
      <button id="pCreate" class="btn primary">Создать</button>
    </div>
  </div>

  <div class="bar-actions">
